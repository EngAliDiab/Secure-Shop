{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block content %}<section class="narrow"><h1>Sign in</h1>
<form method="post" class="stack">{{ csrf_field() }}
<label for="email">Email</label><input id="email" type="email" name="email" required autocomplete="username">
<label for="pw">Password</label><input id="pw" type="password" name="password" required autocomplete="current-password">
<button class="primary">Sign in</button></form>
<p>New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p></section>{% endblock %}
