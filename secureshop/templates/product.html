{% extends "base.html" %}{% block title %}{{ p.name }}{% endblock %}
{% block content %}<section class="narrow"><h1>{{ p.name }}</h1><p class="muted">{{ p.category }}</p>
<p>{{ p.description }}</p><p class="price">{{ p.price_cents|money }}</p>
{% if p.stock > 0 %}<p class="muted">{{ p.stock }} in stock</p>
<form method="post" action="{{ url_for('shop.cart_add') }}" class="row">{{ csrf_field() }}
<input type="hidden" name="product_id" value="{{ p.id }}">
<label for="qty">Quantity</label><input id="qty" type="number" name="qty" value="1" min="1" max="10">
<button>Add to cart</button></form>{% else %}<p>Out of stock.</p>{% endif %}</section>{% endblock %}
